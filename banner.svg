      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>
    <style>
      .name { font: 700 60px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; animation: fade 1.6s ease-out both; }
